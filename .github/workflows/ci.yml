name: CI

on:
  push:
    paths:
      - .github/workflows/*
      - src/**
      - bin/**
      - CMakeLists.txt
  pull_request:
    paths:
      - .github/workflows/*
      - src/**
      - bin/**
      - CMakeLists.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.config.name }} ${{ matrix.arch.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows VS2026, os: windows-2025 }
        arch:
        - { name: X86, flag: Win32 }
        - { name: X64, flag: x64 }
        config:
        - { name: Shared, flags: -DBUILD_SHARED_LIBS=TRUE }
        - { name: Static, flags: -DBUILD_SHARED_LIBS=FALSE }

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Configure
      env:
        ARCH: ${{ matrix.arch.flag }}
        CMAKE_FLAGS: ${{ matrix.config.flags }}
      run: cmake -A "$ARCH" -S . -B build -DCMAKE_INSTALL_PREFIX=install $CMAKE_FLAGS

    - name: Build
      run: cmake --build build --config Release

    - name: Install
      run: cmake --install build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Schiffbruch-${{ matrix.config.name }}-${{ matrix.arch.name }}
        path: ./install/bin/*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Required to create the draft release

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create Draft Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd artifacts
        for dir in */; do
          (cd "$dir" && zip -qr "../${dir%/}.zip" .)
        done
        gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Release $GITHUB_REF_NAME" --draft ./*.zip
